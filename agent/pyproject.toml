[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Claude-powered CI failure triage agent"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.4",
  "mypy>=2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
